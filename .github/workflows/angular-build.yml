name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:

jobs:
  build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker --version

      - name: Build frontend Docker image
        run: |
          docker build \
            --file ./frontend/Dockerfile \
            --tag frontend:${{ github.sha }} \
            ./frontend

      - name: Show built image
        run: docker images frontend-ci:test
